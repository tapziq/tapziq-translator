name: Verify and Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Verify Android project
        run: >
          ./gradlew --no-daemon --no-configuration-cache
          --dependency-verification=strict
          clean :app:checkProductionSigningTaskCoverage
          test lint assembleDebug

      - name: Check release scripts
        run: bash -n scripts/*.sh

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: npm

      - name: Install locked release tooling
        run: npm ci --ignore-scripts

      - name: Verify Conventional Commit history
        run: npm run check:commits

      - name: Audit release tooling
        run: npm run audit:release

      - name: Verify release automation
        run: npm run test:release

  release:
    name: Publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: macos-15-intel
    timeout-minutes: 90
    environment: production
    outputs:
      release_commit: ${{ steps.release_state.outputs.commit }}
    permissions:
      attestations: read
      contents: write
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify production release controls
        run: scripts/verify-release-preconditions.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAPZIQ_TRANSLATOR_RELEASE_STORE_BASE64: ${{ secrets.TAPZIQ_TRANSLATOR_RELEASE_STORE_BASE64 }}
          TAPZIQ_TRANSLATOR_RELEASE_STORE_PASSWORD: ${{ secrets.TAPZIQ_TRANSLATOR_RELEASE_STORE_PASSWORD }}
          TAPZIQ_TRANSLATOR_RELEASE_KEY_ALIAS: ${{ secrets.TAPZIQ_TRANSLATOR_RELEASE_KEY_ALIAS }}
          TAPZIQ_TRANSLATOR_RELEASE_KEY_PASSWORD: ${{ secrets.TAPZIQ_TRANSLATOR_RELEASE_KEY_PASSWORD }}

      - name: Configure release Git authentication
        run: gh auth setup-git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK components
        run: >
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "emulator"
          "system-images;android-36;aosp_atd;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: npm

      - name: Install locked release tooling
        run: npm ci --ignore-scripts

      - name: Create production smoke-test emulator
        run: >
          echo no |
          avdmanager create avd
          --force
          --name tapziq-translator-release
          --package "system-images;android-36;aosp_atd;x86_64"

      - name: Reconcile, build, smoke-test, and publish
        run: scripts/run-production-emulator.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAPZIQ_TRANSLATOR_RELEASE_REPOSITORY: ${{ github.repository }}
          TAPZIQ_TRANSLATOR_RUN_EMULATOR_SMOKE: "1"
          TAPZIQ_TRANSLATOR_RELEASE_STORE_BASE64: ${{ secrets.TAPZIQ_TRANSLATOR_RELEASE_STORE_BASE64 }}
          TAPZIQ_TRANSLATOR_RELEASE_STORE_PASSWORD: ${{ secrets.TAPZIQ_TRANSLATOR_RELEASE_STORE_PASSWORD }}
          TAPZIQ_TRANSLATOR_RELEASE_KEY_ALIAS: ${{ secrets.TAPZIQ_TRANSLATOR_RELEASE_KEY_ALIAS }}
          TAPZIQ_TRANSLATOR_RELEASE_KEY_PASSWORD: ${{ secrets.TAPZIQ_TRANSLATOR_RELEASE_KEY_PASSWORD }}

      - name: Record release source
        id: release_state
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  audit:
    name: Audit published release
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release.outputs.release_commit }}

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: npm

      - name: Audit any release for this commit
        run: scripts/verify-current-release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
